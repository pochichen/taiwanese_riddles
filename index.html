<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味猜謎</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <div class="top-nav">
            <button id="btn-prev" class="btn top-left">⬅️ 上一題</button>
            <div id="progress-container" class="progress-container">
                <span id="progress-text" class="progress-text">載入中...</span>
                <div class="progress-bar-bg" aria-hidden="true">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
            <div class="nav-right">
                <div class="font-size-control" id="font-size-control" aria-label="字體大小切換">
                    <span class="font-control-label">🔤 字體</span>
                    <div class="font-btn-group">
                        <button type="button" class="font-btn active" data-size="small" title="小字體（標準）">小</button>
                        <button type="button" class="font-btn" data-size="medium" title="中字體">中</button>
                        <button type="button" class="font-btn" data-size="large" title="大字體（電視/長輩）">大</button>
                    </div>
                </div>
                <button id="btn-next" class="btn top-right">下一題 ➡️</button>
            </div>
        </div>

        <main class="container">
            <div id="status-badge" class="status-badge">🤔 思考中</div>
            <div class="question-wrapper">
                <h1 id="question">載入中...</h1>
                <div id="question-tl" class="question-tl"></div>
            </div>
            <div id="hint-display" class="hint-text hidden"></div>
            <div id="answer-section" class="answer-section hidden">
                <div id="answer-display" class="answer-text"></div>
                <div id="answer-tl" class="answer-tl"></div>
                <div id="explanation-display" class="explanation-text hidden"></div>
            </div>
        </main>

        <div class="controls">
            <button id="btn-hint" class="btn bottom-left">💡 提示</button>
            <button id="btn-answer" class="btn bottom-right">🔓 看答案</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
